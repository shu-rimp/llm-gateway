services:
  postgres:
    image: 'timescale/timescaledb:2.28.3-pg17'
    environment:
      - 'POSTGRES_DB=llm_gateway'
      - 'POSTGRES_USER=llm_gateway'
      - 'POSTGRES_PASSWORD=llm_gateway_dev'
    ports:
      - '5432:5432'
    labels:
      - 'org.springframework.boot.service-connection=postgres'
