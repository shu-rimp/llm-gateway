spring.application.name=llm-gateway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8000
llm-gateway.providers.ollama.base-url=http://localhost:11434
llm-gateway.providers.ollama.chat-path=/v1/chat/completions
llm-gateway.providers.ollama.models=gemma4:12b,gemma4:26b
llm-gateway.providers.ollama.read-timeout=60s
llm-gateway.providers.gemini.api-key=${GEMINI_API_KEY:}
llm-gateway.providers.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
llm-gateway.providers.gemini.chat-path=/chat/completions
llm-gateway.providers.gemini.models=gemini-3.5-flash-lite
llm-gateway.providers.gemini.read-timeout=60s
llm-gateway.eval.judge-model=gemini-3.5-flash-lite